
name: Deploy Clear Cents AI Newsroom

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN_NEW }}
          accountId: ${{ secrets.CF_ACCOUNT_ID_NEW }}
          command: deploy --verbose
